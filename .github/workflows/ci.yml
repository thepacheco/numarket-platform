name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: numarket
          POSTGRES_PASSWORD: numarket
          POSTGRES_DB: numarket_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U numarket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://numarket:numarket@localhost:5432/numarket_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (tenant isolation, roles, policy, snapshots, access guards)
        run: npm test
      - run: npm audit --omit=dev --audit-level=high
